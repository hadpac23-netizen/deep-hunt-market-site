<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BOOM Login</title>
  <style>
    :root{--bg:#070a0f;--line:#283143;--text:#fff;--muted:#98a3b3;--accent:#d6ff4b;--danger:#ff6b81}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(99,230,255,.08),transparent 30%),radial-gradient(circle at 80% 0,rgba(214,255,75,.08),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .box{width:min(420px,calc(100vw - 28px));padding:26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.015));box-shadow:0 20px 70px rgba(0,0,0,.35)}
    .logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#809cff,#6a63ff);font-weight:950;margin-bottom:15px;box-shadow:0 0 30px rgba(106,99,255,.25)}
    small{display:block;color:var(--accent);letter-spacing:.13em;font-weight:900;font-size:10px}
    h1{margin:7px 0 8px;font-size:30px}
    p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px}
    label{display:block;color:#c8d0db;font-size:11px;margin:10px 0 5px}
    input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:#080c12;color:#fff;outline:none}
    input:focus{border-color:#55667d;box-shadow:0 0 0 3px rgba(85,102,125,.12)}
    button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:11px;background:var(--accent);color:#091006;font-weight:950;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .err{color:var(--danger);font-size:11px;min-height:20px;margin-top:8px}
    .note{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);color:#758194;font-size:10px;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">B</div>
    <small>BOOM SUPER AGENT</small>
    <h1>כניסת Owner</h1>
    <p>היכנס עם חשבון ה־Admin של HUNT כדי לפתוח את BOOM AI Engineering Studio.</p>
    <label for="email">אימייל</label>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <label for="password">סיסמה</label>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err" aria-live="polite"></div>
    <button id="go" type="button">כניסה ל־BOOM</button>
    <div class="note">Owner/Admin בלבד. לאחר הכניסה תיפתח מערכת ה־Studio החיה.</div>
  </div>
  <script>
    const emailEl=document.getElementById("email");
    const passwordEl=document.getElementById("password");
    const errEl=document.getElementById("err");
    const goEl=document.getElementById("go");
    async function login(){
      goEl.disabled=true;
      errEl.textContent="";
      try{
        const response=await fetch(location.href,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email:emailEl.value,password:passwordEl.value})});
        const data=await response.json();
        if(!response.ok||data.error)throw new Error(data.error||"Login failed");
        location.reload();
      }catch(error){
        errEl.textContent=error.message||"Login failed";
      }finally{
        goEl.disabled=false;
      }
    }
    goEl.addEventListener("click",login);
    passwordEl.addEventListener("keydown",event=>{if(event.key==="Enter")login()});
  </script>
  <script src="analytics-config.js?v=analytics2"></script>
  <script src="analytics.js?v=huntmetrics2"></script>
</body>
</html>
