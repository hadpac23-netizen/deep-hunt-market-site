<!doctype html><meta charset="utf-8"><title>HUNT Home3 Actions QA</title>
<style>body{font:13px system-ui;background:#111;color:#eee;margin:14px}.case{border:1px solid #444;padding:8px;margin:10px 0}.pass{color:#76e8a2}.fail{color:#ff7e92}.viewport{overflow:hidden;max-height:380px}iframe{display:block;border:0;background:#fff}pre{white-space:pre-wrap}</style>
<h1>HUNT HOME 3 ACTIONS QA</h1><div id="host"></div><pre id="result">RUNNING</pre>
<script>
const widths=[390,1440],host=document.querySelector('#host'),wait=ms=>new Promise(r=>setTimeout(r,ms));
async function one(w){
 localStorage.removeItem('hunt_local_product_actions_v1');localStorage.setItem('hunt_theme_v1','light');
 const box=document.createElement('section');box.className='case';const status=document.createElement('div');
 const wrap=document.createElement('div');wrap.className='viewport';wrap.style.width=w+'px';const f=document.createElement('iframe');f.width=w;f.height=1000;f.src='./index.html';wrap.appendChild(f);box.append(status,wrap);host.appendChild(box);
 await new Promise(r=>f.addEventListener('load',r,{once:true}));await wait(6500);
 const d=f.contentDocument,cw=f.contentWindow,card=d.querySelector('#hd-home3-for-you .hd-home3-card');
 const like=card?.querySelector('[data-shop-action="like"]'),save=card?.querySelector('[data-shop-action="save"]');
 like?.click();await wait(120);save?.click();await wait(120);
 const liked=like?.getAttribute('aria-pressed')==='true',saved=save?.getAttribute('aria-pressed')==='true';
 const persisted=Object.values(JSON.parse(cw.localStorage.getItem('hunt_local_product_actions_v1')||'{}')).some(x=>x?.liked&&x?.saved);
 const toggle=d.querySelector('[data-hunt-theme-toggle]');toggle?.click();await wait(120);
 const img=card?.querySelector('img'),style=img?cw.getComputedStyle(img):null;
 const dark=d.documentElement.dataset.huntTheme==='dark';
 const imageSafe=!!style&&style.filter==='none'&&style.opacity==='1'&&style.mixBlendMode==='normal';
 const overflow=Math.max(0,d.documentElement.scrollWidth-d.documentElement.clientWidth);
 const pass=!!like&&!!save&&liked&&saved&&persisted&&dark&&imageSafe&&overflow<=4;
 const out={width:w,pass,liked,saved,persisted,dark,imageSafe,overflow};status.className=pass?'pass':'fail';status.textContent=(pass?'PASS ':'FAIL ')+JSON.stringify(out);return out;
}
(async()=>{const results=[];for(const w of widths)results.push(await one(w));const pass=results.every(x=>x.pass);document.body.dataset.qa=pass?'pass':'fail';document.querySelector('#result').textContent=(pass?'PASS':'FAIL')+'\n'+JSON.stringify({pass,results},null,2)})();
</script>
