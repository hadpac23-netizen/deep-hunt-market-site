<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUNT · Category → PLP Preview</title>
<meta name="color-scheme" content="dark light">
<style>
:root{
  --bg:#07111c;--panel:#0b1724;--panel2:#102235;--ink:#f6f2e8;--muted:#94a6b8;
  --edge:rgba(255,255,255,.11);--gold:#e2bd66;--blue:#5fa9ff;--good:#67d39c;
  --shadow:0 24px 70px rgba(0,0,0,.28)
}
[data-theme="light"]{
  --bg:#f5f1e8;--panel:#fffdf8;--panel2:#f1eadc;--ink:#162130;--muted:#617184;
  --edge:rgba(22,33,48,.13);--gold:#9f7422;--blue:#245f9d;--good:#237b52;
  --shadow:0 24px 70px rgba(39,48,61,.12)
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}
button{color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.shell{width:min(1480px,100%);margin:auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--edge)}
.topbar-inner{display:flex;align-items:center;gap:18px;padding:14px clamp(18px,4vw,58px)}
.brand{font:800 22px/1 Georgia,serif;letter-spacing:.13em}
.brand b{color:var(--gold)}
.main-nav{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.main-nav button,.ghost{border:1px solid var(--edge);background:var(--panel);border-radius:999px;padding:9px 13px;cursor:pointer}
.main-nav button.active{border-color:color-mix(in srgb,var(--gold) 60%,var(--edge));background:color-mix(in srgb,var(--gold) 13%,var(--panel))}
.ghost{white-space:nowrap}
.hero{padding:56px clamp(18px,5vw,78px) 34px;border-bottom:1px solid var(--edge);background:
 radial-gradient(circle at 10% 10%,rgba(95,169,255,.13),transparent 30%),
 radial-gradient(circle at 85% 0%,rgba(226,189,102,.12),transparent 26%)}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:.17em;color:var(--gold);text-transform:uppercase}
.hero h1{margin:9px 0 10px;font:700 clamp(48px,8vw,105px)/.9 Georgia,serif}
.hero p{max-width:760px;color:var(--muted);line-height:1.65;margin:0}
.statusline{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.statusline span{border:1px solid var(--edge);background:var(--panel);padding:7px 10px;border-radius:999px;font-size:10px;color:var(--muted)}
.content{padding:34px clamp(18px,5vw,78px) 80px}
.breadcrumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:18px}
.breadcrumb button{border:0;background:none;color:var(--blue);padding:0;cursor:pointer}
.section-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}
.section-head h2{margin:0;font:700 clamp(30px,4vw,54px)/1 Georgia,serif}
.section-head p{margin:7px 0 0;color:var(--muted);max-width:760px;line-height:1.55}
.department-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.department-card{border:1px solid var(--edge);background:var(--panel);border-radius:24px;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow);min-height:240px}
.department-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--gold) 45%,var(--edge))}
.department-card .visual{height:150px;background:linear-gradient(145deg,var(--panel2),var(--panel));overflow:hidden}
.department-card img{width:100%;height:100%;object-fit:cover}
.department-card .body{padding:16px}
.department-card small{display:block;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.department-card strong{display:block;font:700 24px/1.05 Georgia,serif;margin-top:6px}
.department-card span{display:block;color:var(--muted);font-size:11px;margin-top:8px}
.plp-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 0 20px;border-bottom:1px solid var(--edge);margin-bottom:22px}
.plp-tools .count{color:var(--muted);font-size:11px}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 14px}
.product-card{border:1px solid var(--edge);background:var(--panel);border-radius:22px;overflow:hidden;min-width:0;box-shadow:0 16px 44px rgba(0,0,0,.14)}
.product-media{aspect-ratio:4/5;background:var(--panel2);overflow:hidden}
.product-media img{width:100%;height:100%;object-fit:cover}
.product-body{padding:13px}
.product-body .route{font-size:9px;color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.product-body h3{font-size:13px;line-height:1.35;margin:7px 0 6px}
.product-body p{font-size:10px;color:var(--muted);margin:0}
.empty{padding:44px 18px;text-align:center;border:1px dashed var(--edge);border-radius:22px;color:var(--muted)}
.loadmore{display:block;margin:28px auto 0;border:1px solid var(--edge);background:var(--panel);border-radius:999px;padding:11px 18px;cursor:pointer}
.note{margin-top:34px;padding:18px;border:1px solid var(--edge);background:var(--panel);border-radius:20px;color:var(--muted);font-size:11px;line-height:1.6}
@media(max-width:1100px){.department-grid,.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){
  .topbar-inner{align-items:flex-start;flex-wrap:wrap}.main-nav{order:3;width:100%}
  .hero{padding-top:34px}.department-grid,.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .department-card{min-height:200px}.department-card .visual{height:115px}.department-card strong{font-size:19px}
}
@media(max-width:430px){.department-grid,.product-grid{grid-template-columns:1fr 1fr}.content{padding-left:12px;padding-right:12px}.hero{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">HUNT <b>DEAL</b></div>
      <nav class="main-nav" id="main-nav" aria-label="Main categories"></nav>
      <button class="ghost" id="theme-toggle" type="button">Light / Dark</button>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow" id="eyebrow">CATEGORY PAGE</div>
    <h1 id="hero-title">HUNT</h1>
    <p id="hero-copy">Choose a main category. Its departments appear first. Opening a department switches to a clean product listing page with only that department's products.</p>
    <div class="statusline">
      <span>Preview only</span><span>Production OFF</span><span>Exact route only</span><span>No horizontal product rails</span>
    </div>
  </section>

  <main class="content">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="view"></div>
  </main>
</div>

<script>
const $=q=>document.querySelector(q);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data=null,supp={shelves:{}},launch={shelves:{}},active=0,selectedShelf="",visible=24;
let routeOwner=new Map(),syntheticJewelry=null;

const blocked=/\b(gun|rifle|pistol|weapon|knife|blade|vape|tobacco|cigarette|alcohol|beer|wine|whiskey|cannabis|marijuana|thc|sexy toy|adult toy)\b/i;

const jewelryRules=[
  ["earrings","Earrings",/\b(earring|earrings|stud earrings?|hoop earrings?)\b/i],
  ["necklaces","Necklaces",/\b(necklace|necklaces|pendant|pendants|choker|chokers)\b/i],
  ["bracelets","Bracelets",/\b(bracelet|bracelets|bangle|bangles)\b/i],
  ["rings","Rings",/\b(ring|rings|signet ring|band ring)\b/i],
  ["anklets","Anklets",/\b(anklet|anklets|ankle chain)\b/i],
  ["brooches","Brooches & Pins",/\b(brooch|brooches|lapel pin|jewelry pin)\b/i],
  ["jewelry-sets","Jewelry Sets",/\b(jewelry set|jewellery set)\b/i]
];

function key(p){return String(p?.provider||"UNKNOWN")+":"+String(p?.item_id||"")}
function sourceAlias(provider){
  const v=String(provider||"").toLowerCase();
  if(v.includes("cj"))return"h1";if(v.includes("eprolo"))return"h2";if(v.includes("printful"))return"h3";if(v.includes("gooten"))return"h4";
  return"";
}
function textOf(p){return String((p?.title||"")+" "+(p?.category_title||"")+" "+(p?.category||""))}
function normalizeSlug(v){return String(v||"").toLowerCase().trim().replace(/\s+/g,"-").replace(/^(women|men)-/,"")}

const exactRules=[
  ["dresses",/\b(dress|dresses|gown|gowns)\b/i,/\b(tree skirt|christmas tree skirt)\b/i],
  ["socks",/\b(sock|socks)\b/i],
  ["swimwear",/\b(swimwear|swimsuit|swim shorts|swimming trunks|board shorts|boardshorts|bikini)\b/i],
  ["shoes",/\b(shoe|shoes|sneaker|sneakers|loafer|loafers|boots?|sandals?|slides?|heels?)\b/i],
  ["bags",/\b(handbag|purse|tote|crossbody|backpack|duffel|duffle|shoulder bag|messenger bag|chest bag|\bbag\b)\b/i],
  ["earrings",/\b(earring|earrings|stud earrings?|hoop earrings?)\b/i],
  ["necklaces",/\b(necklace|necklaces|pendant|pendants|choker|chokers)\b/i],
  ["bracelets",/\b(bracelet|bracelets|bangle|bangles)\b/i],
  ["rings",/\b(ring|rings|signet ring|band ring)\b/i],
  ["anklets",/\b(anklet|anklets|ankle chain)\b/i],
  ["brooches",/\b(brooch|brooches|lapel pin|jewelry pin)\b/i],
  ["hair-accessories",/\b(hair clip|hairpin|headband|scrunchie|barrette|hair accessory)\b/i],
  ["hats",/\b(hat|hats|cap|caps|beanie|bucket hat)\b/i],
  ["watches",/\b(watch|watches|wristwatch)\b/i],
  ["sunglasses",/\b(sunglass|sunglasses|sun glasses)\b/i],
  ["underwear",/\b(boxer|boxers|brief|briefs|underwear|underpants|trunks)\b/i],
  ["hoodies",/\b(hoodie|hoodies|sweatshirt|sweatshirts)\b/i],
  ["knitwear",/\b(sweater|sweaters|cardigan|cardigans|knitwear|pullover)\b/i],
  ["jackets",/\b(jacket|jackets|coat|coats|parka|windbreaker|bomber|trench)\b/i],
  ["skirts",/\b(skirt|skirts)\b/i],
  ["lighting",/\b(lamp|lamps|lighting|night light|desk light|ceiling light|led light)\b/i],
  ["kitchen",/\b(kitchen|cookware|utensil|bakeware|lunch box|food storage)\b/i],
  ["storage",/\b(storage|organizer|closet|rack|shelf|shelving)\b/i]
];

function exactIdentity(slug,p){
  const s=normalizeSlug(slug),t=textOf(p);
  const rule=exactRules.find(([id])=>id===s);
  if(rule){
    if(rule[2]&&rule[2].test(t))return false;
    return rule[1].test(t);
  }
  if(s==="accessories"){
    if(/\b(sock|socks|earring|necklace|pendant|bracelet|bangle|ring|anklet|brooch|handbag|purse|tote|crossbody|backpack|hat|cap|beanie|watch|sunglass|shoe|sneaker|swimwear|swimsuit)\b/i.test(t))return false;
    if(/\b(laptop|cooling pad|conference chair|office chair|tent|gazebo|brake|hitch|winch|engine|exhaust|pulley|cleaner|steam mop|kitchen|lamp|lighting|storage rack|shelf|gaming|controller|phone case)\b/i.test(t))return false;
    return /\b(belt|wallet|card holder|scarf|shawl|glove|gloves|tie|bow tie|keychain|key chain|key ring|cufflink|cufflinks|suspender|suspenders|pocket square)\b/i.test(t);
  }
  return true;
}
function productAllowed(dept,cat,p){
  if(!p?.item_id||blocked.test(textOf(p)))return false;
  if(!exactIdentity(cat.slug,p))return false;
  const owner=routeOwner.get(key(p));
  return !owner||owner===dept.slug+"/"+cat.slug;
}
function routeProducts(dept,cat){
  const route=dept.slug+"/"+cat.slug;
  const rows=[...(cat.products||[]),...(supp.shelves?.[route]||[]),...(launch.shelves?.[route]||[])];
  const seen=new Set(),out=[];
  for(const p of rows){
    const k=key(p);if(seen.has(k)||!productAllowed(dept,cat,p))continue;
    seen.add(k);out.push({...p});
  }
  return out;
}
function buildRouteOwners(){
  const candidates=new Map();
  for(const dept of data.departments||[]){
    for(const cat of dept.categories||[]){
      const route=dept.slug+"/"+cat.slug;
      const rows=[...(cat.products||[]),...(supp.shelves?.[route]||[]),...(launch.shelves?.[route]||[])];
      for(const p of rows){
        if(!p?.item_id||blocked.test(textOf(p)))continue;
        let score=0;
        const explicitShelf=String(p.storefront_shelf||p.canonical_shelf||p.category||"");
        const explicitDept=String(p.storefront_department||p.canonical_department||p.department||"");
        if(explicitDept===dept.slug)score+=300;
        if(explicitShelf===cat.slug)score+=400;
        if(String(p.taxonomy_exact_lock||"").toUpperCase()==="LOCKED")score+=800;
        if(exactIdentity(cat.slug,p))score+=120;
        const arr=candidates.get(key(p))||[];arr.push({route,score});candidates.set(key(p),arr);
      }
    }
  }
  routeOwner=new Map();
  for(const [k,arr] of candidates){arr.sort((a,b)=>(b.score-a.score)||a.route.localeCompare(b.route));routeOwner.set(k,arr[0].route)}
}
function buildJewelry(){
  const raw=[],seen=new Set();
  for(const dept of data.departments||[]){
    for(const cat of dept.categories||[]){
      const route=dept.slug+"/"+cat.slug;
      for(const p of [...(cat.products||[]),...(supp.shelves?.[route]||[]),...(launch.shelves?.[route]||[])]){
        const k=key(p);if(seen.has(k)||!p?.item_id||blocked.test(textOf(p)))continue;
        if(!/\b(jewelry|jewellery|earring|necklace|pendant|choker|bracelet|bangle|ring|anklet|brooch)\b/i.test(textOf(p)))continue;
        seen.add(k);raw.push(p);
      }
    }
  }
  const claimed=new Set(),categories=[];
  for(const [slug,title,re] of jewelryRules){
    const products=[];
    for(const p of raw){const k=key(p);if(claimed.has(k)||!re.test(textOf(p)))continue;claimed.add(k);routeOwner.set(k,"jewelry/"+slug);products.push({...p,category:slug,category_title:title})}
    if(products.length)categories.push({slug,title,products});
  }
  if(categories.length)syntheticJewelry={slug:"jewelry",title:"Jewelry",categories,hero:categories[0]?.products?.[0]||null};
}
function departments(){
  const base=[...(data?.departments||[])];
  if(syntheticJewelry&&!base.some(d=>d.slug==="jewelry"))base.push(syntheticJewelry);
  return base;
}
function dept(){return departments()[active]}
function cat(){return dept()?.categories?.find(c=>c.slug===selectedShelf)||null}
function heroImage(cat){
  const p=routeProducts(dept(),cat)[0]||cat.products?.[0];
  return p?.image_url||"";
}
function productCard(p,department,shelf){
  const href="product.html?src="+encodeURIComponent(sourceAlias(p.provider))+"&id="+encodeURIComponent(String(p.item_id||""));
  return '<a class="product-card" href="'+href+'" data-provider="'+esc(p.provider)+'" data-id="'+esc(p.item_id)+'" data-dept="'+esc(department.slug)+'" data-shelf="'+esc(shelf.slug)+'">'+
    '<div class="product-media">'+(p.image_url?'<img loading="lazy" src="'+esc(p.image_url)+'" alt="'+esc(p.title||"Product")+'">':'')+'</div>'+
    '<div class="product-body"><div class="route">'+esc(department.title)+' / '+esc(shelf.title)+'</div><h3>'+esc(p.title||"Product")+'</h3><p>'+esc(p.provider||"HUNT")+' · exact shelf</p></div></a>';
}
function renderNav(){
  $("#main-nav").innerHTML=departments().map((d,i)=>'<button type="button" class="'+(i===active?'active':'')+'" data-dept="'+i+'">'+esc(d.title)+'</button>').join("");
}
function renderHub(){
  const d=dept();selectedShelf="";visible=24;
  $("#eyebrow").textContent="CATEGORY PAGE";
  $("#hero-title").textContent=d.title;
  $("#hero-copy").textContent="Choose a department first. Products do not appear until you enter one exact department.";
  $("#breadcrumb").innerHTML='<span>HUNT</span><span>›</span><strong>'+esc(d.title)+'</strong>';
  const cards=(d.categories||[]).map(c=>{
    const rows=routeProducts(d,c),img=heroImage(c);
    return '<button type="button" class="department-card" data-shelf="'+esc(c.slug)+'">'+
      '<div class="visual">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="">':'')+'</div>'+
      '<div class="body"><small>Department</small><strong>'+esc(c.title)+'</strong><span>'+rows.length+' exact products</span></div></button>';
  }).join("");
  $("#view").innerHTML='<div class="section-head"><div><h2>'+esc(d.title)+' departments</h2><p>Choose one department. HUNT then opens a dedicated product listing page for that department only.</p></div></div>'+
    '<div class="department-grid">'+cards+'</div>'+
    '<div class="note">Category Page = navigation. Product Listing Page = products. The two modes are deliberately separated so products from neighboring departments cannot visually mix.</div>';
  syncUrl();
}
function renderPLP(){
  const d=dept(),c=cat();if(!c){renderHub();return}
  const rows=routeProducts(d,c);
  const shown=rows.slice(0,visible);
  $("#eyebrow").textContent="PRODUCT LISTING PAGE";
  $("#hero-title").textContent=c.title;
  $("#hero-copy").textContent="Only "+d.title+" → "+c.title+" products. Scroll downward to browse; related departments stay outside the product grid.";
  $("#breadcrumb").innerHTML='<button type="button" data-back-category>'+esc(d.title)+'</button><span>›</span><strong>'+esc(c.title)+'</strong>';
  $("#view").innerHTML='<div class="section-head"><div><h2>'+esc(c.title)+'</h2><p>Exact department product grid. No cross-shelf filler and no horizontal carousel.</p></div></div>'+
    '<div class="plp-tools"><div class="count">'+rows.length+' exact products · '+shown.length+' shown</div><button class="ghost" type="button" data-back-category>All '+esc(d.title)+' departments</button></div>'+
    (shown.length?'<div class="product-grid">'+shown.map(p=>productCard(p,d,c)).join("")+'</div>':'<div class="empty">No exact products pass the shelf guard yet. HUNT will not fill this department with unrelated products.</div>')+
    (shown.length<rows.length?'<button class="loadmore" type="button" data-load-more>Load 24 more</button>':'')+
    '<div class="note">This page intentionally behaves like a PLP: the user stays inside one department and scrolls downward through its products. Other departments do not enter this grid.</div>';
  syncUrl();
}
function syncUrl(){
  const d=dept(),q=new URLSearchParams(location.search);q.set("dept",d.slug);
  if(selectedShelf)q.set("shelf",selectedShelf);else q.delete("shelf");
  history.replaceState(null,"",location.pathname+"?"+q.toString());
}
function restoreRoute(){
  const q=new URLSearchParams(location.search),ds=q.get("dept"),ss=q.get("shelf");
  const idx=departments().findIndex(d=>d.slug===ds);active=idx>=0?idx:0;selectedShelf=ss||"";
}
function render(){renderNav();selectedShelf?renderPLP():renderHub()}

document.addEventListener("click",e=>{
  const main=e.target.closest("[data-dept]");
  if(main){active=Number(main.dataset.dept)||0;selectedShelf="";visible=24;render();return}
  const shelf=e.target.closest("[data-shelf]");
  if(shelf){selectedShelf=String(shelf.dataset.shelf||"");visible=24;render();return}
  const back=e.target.closest("[data-back-category]");
  if(back){selectedShelf="";visible=24;renderHub();return}
  const more=e.target.closest("[data-load-more]");
  if(more){visible+=24;renderPLP();return}
  const product=e.target.closest(".product-card");
  if(product){
    const d=dept(),c=cat(),rows=routeProducts(d,c);
    const p=rows.find(x=>String(x.provider||"")===String(product.dataset.provider||"")&&String(x.item_id||"")===String(product.dataset.id||""));
    if(p){
      const routed={...p,hunt_department:d.slug,hunt_shelf:c.slug,canonical_department:d.slug,canonical_shelf:c.slug};
      try{sessionStorage.setItem("hunt_product_"+p.provider+":"+p.item_id,JSON.stringify(routed))}catch{}
    }
  }
});
$("#theme-toggle").addEventListener("click",()=>{
  document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";
});

Promise.all([
  fetch("./evidence/HUNT-FULL-SHELVES-STYLIST-SHADOW-2026-09-23.json").then(r=>r.json()),
  fetch("./evidence/HUNT-TAXONOMY-PROFIT-V2-PREVIEW-SUPPLEMENT-2026-09-27.json").then(r=>r.ok?r.json():({shelves:{}})).catch(()=>({shelves:{}})),
  fetch("./evidence/HUNT-MEN-LAUNCH-LOCKED-SUPPLEMENT-2026-09-28.json").then(r=>r.ok?r.json():({shelves:{}})).catch(()=>({shelves:{}}))
]).then(([base,s,t])=>{
  data=base;supp=s||{shelves:{}};launch=t||{shelves:{}};
  buildRouteOwners();buildJewelry();restoreRoute();render();
}).catch(err=>{
  $("#view").innerHTML='<div class="empty">Preview data failed to load: '+esc(err?.message||err)+'</div>';
});
</script>
</body>
</html>
