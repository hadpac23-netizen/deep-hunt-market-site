<!doctype html>
<html lang="en" data-hunt-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUNT · Simple First V9</title>
<style>
:root{
  --bg:#050914;--ink:#f7f8fb;--muted:#a9b2c6;--panel:rgba(11,18,38,.82);--panel2:rgba(13,22,49,.94);
  --edge:rgba(255,255,255,.11);--spark:#f2d36b;--media:#f4f1eb;--media2:#fffdf8;--glow:rgba(77,112,255,.28);
  --shadow:0 30px 80px rgba(0,0,0,.42);--accent:#6d8cff;--accent2:#c98fb9
}
html[data-hunt-theme="light"]{
  --bg:#f3f0e8;--ink:#182035;--muted:#6f7684;--panel:rgba(252,249,242,.88);--panel2:rgba(245,241,232,.97);
  --edge:rgba(24,32,53,.11);--spark:#96691b;--media:#fbfaf6;--media2:#f3efe7;--glow:rgba(70,102,190,.13);
  --shadow:0 26px 66px rgba(38,44,61,.12)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
radial-gradient(62% 48% at 12% 3%,var(--glow),transparent 70%),
radial-gradient(55% 40% at 91% 11%,color-mix(in srgb,var(--accent2) 18%,transparent),transparent 72%)}
button{font:inherit}
.topbar{position:sticky;top:0;z-index:50;padding:12px clamp(16px,3vw,42px);backdrop-filter:blur(20px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--edge)}
.topline{display:flex;align-items:center;gap:16px}
.brand{font:800 24px/1 Georgia,serif;letter-spacing:.04em;white-space:nowrap}.brand span{color:var(--spark)}
.shadow-note{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:850;white-space:nowrap}
.theme{margin-left:auto;border:1px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer}
.dept-nav{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin-top:10px;padding-bottom:1px}.dept-nav::-webkit-scrollbar{display:none}
.category-drawer-shell{margin:10px 0 0;border-top:1px solid var(--edge);padding-top:10px}
.category-drawer-label{font-size:9px;letter-spacing:.15em;color:var(--spark);font-weight:900;margin-bottom:8px;text-transform:uppercase}
.dept-nav button{border:1px solid var(--edge);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-weight:780;font-size:11px;cursor:pointer;white-space:nowrap}
.cat-chip{position:relative;isolation:isolate;display:grid;grid-template-columns:36px 1fr;align-items:center;gap:9px;min-height:48px;border:1px solid var(--edge);background:linear-gradient(145deg,color-mix(in srgb,var(--panel2) 88%,transparent),var(--panel));color:var(--ink);border-radius:16px;padding:6px 11px 6px 6px;font-weight:780;font-size:10px;cursor:pointer;white-space:nowrap;overflow:hidden;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.cat-chip:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 42%,var(--edge));box-shadow:0 14px 28px rgba(0,0,0,.18)}
.cat-chip .chip-media{width:36px;height:36px;border-radius:11px;overflow:hidden;background:linear-gradient(145deg,var(--media2),var(--media));border:1px solid var(--edge)}
.cat-chip .chip-media img{width:100%;height:100%;object-fit:cover}
.cat-chip .chip-copy{display:grid;gap:2px;text-align:left}
.cat-chip .chip-copy strong{font-size:10px;line-height:1.05}
.cat-chip .chip-copy small{font-size:8px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.dept-nav button.active{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 60%,var(--edge));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent)}
.stage{min-height:72vh;padding:86px clamp(20px,5vw,74px) 64px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.66fr);gap:6vw;align-items:center;border-bottom:1px solid var(--edge)}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--spark);font-weight:900;margin-bottom:16px}
h1{font:700 clamp(58px,8vw,126px)/.84 Georgia,"Times New Roman",serif;letter-spacing:-.055em;margin:0}
.lede{max-width:680px;font-size:clamp(16px,1.4vw,21px);line-height:1.55;color:var(--muted);margin:26px 0}
.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{border:1px solid var(--edge);background:var(--panel);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:10px;font-weight:800}
.hero{position:relative;aspect-ratio:.78;border-radius:34px;overflow:hidden;border:1px solid var(--edge);background:linear-gradient(155deg,var(--panel2),var(--panel));box-shadow:var(--shadow)}
.hero-media{position:absolute;inset:0 0 27%;display:grid;place-items:center;background:radial-gradient(circle at 50% 43%,rgba(255,255,255,.98),rgba(255,255,255,.74) 34%,transparent 67%),linear-gradient(160deg,var(--media2),var(--media))}
.hero-media img{width:100%;height:100%;object-fit:contain;padding:24px;filter:drop-shadow(0 25px 34px rgba(16,25,43,.22))}
.hero-media.promo-floor{background:
radial-gradient(circle at 18% 18%,color-mix(in srgb,var(--accent) 42%,transparent),transparent 33%),
radial-gradient(circle at 80% 14%,color-mix(in srgb,var(--spark) 28%,transparent),transparent 34%),
radial-gradient(circle at 65% 76%,color-mix(in srgb,var(--accent2) 28%,transparent),transparent 32%),
linear-gradient(155deg,var(--panel2),var(--panel));overflow:hidden}
.hero-media.promo-floor::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 45deg,transparent,color-mix(in srgb,var(--accent) 13%,transparent),transparent 34%,color-mix(in srgb,var(--spark) 10%,transparent),transparent 72%);animation:campaignSweep 18s linear infinite}
.hero-media.promo-floor img{display:none}
.promo-mark{position:relative;z-index:3;font:800 clamp(42px,7vw,92px)/.88 Georgia,serif;letter-spacing:-.055em;text-align:left;color:var(--ink);opacity:.98;width:82%;text-shadow:0 18px 38px rgba(0,0,0,.24)}
.promo-mark span{display:block;font:900 10px/1.2 Inter,sans-serif;letter-spacing:.24em;color:var(--spark);margin-top:14px;text-transform:uppercase}
.promo-scene{position:absolute;inset:0;z-index:2;pointer-events:none}
.promo-object{position:absolute;width:31%;aspect-ratio:.8;border-radius:24px;overflow:hidden;border:1px solid color-mix(in srgb,var(--edge) 85%,transparent);background:linear-gradient(150deg,var(--media2),var(--media));box-shadow:0 28px 60px rgba(0,0,0,.24);opacity:.0;transform:translateY(16px) scale(.96);transition:opacity .7s ease,transform .8s cubic-bezier(.16,.8,.2,1)}
.promo-object.show{opacity:.78;transform:translateY(0) scale(1)}
.promo-object:nth-child(1){right:8%;top:7%;transform:rotate(7deg) translateY(16px) scale(.96)}
.promo-object:nth-child(1).show{transform:rotate(7deg) translateY(0) scale(1)}
.promo-object:nth-child(2){right:39%;bottom:5%;width:25%;transform:rotate(-7deg) translateY(16px) scale(.96)}
.promo-object:nth-child(2).show{transform:rotate(-7deg) translateY(0) scale(1)}
.promo-object:nth-child(3){left:5%;bottom:6%;width:20%;transform:rotate(4deg) translateY(16px) scale(.96)}
.promo-object:nth-child(3).show{transform:rotate(4deg) translateY(0) scale(1)}
.promo-object img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;padding:0!important;filter:none!important}
.campaign-dots{display:flex;gap:6px;margin-top:10px}.campaign-dots i{width:18px;height:2px;background:var(--edge);border-radius:2px}.campaign-dots i.active{background:var(--spark)}
@keyframes campaignSweep{to{transform:rotate(360deg)}}
@keyframes shelfReveal{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.hero-meta{position:absolute;left:18px;right:18px;bottom:16px;padding:16px;border:1px solid var(--edge);border-radius:20px;background:color-mix(in srgb,var(--panel2) 88%,transparent);backdrop-filter:blur(18px)}
.hero-meta small{display:block;color:var(--spark);font-size:9px;letter-spacing:.14em;font-weight:900;margin-bottom:6px}.hero-meta strong{display:block;font:700 21px/1.16 Georgia,serif}.hero-meta span{display:block;color:var(--muted);font-size:10px;margin-top:7px}
.category-index{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;overflow:visible;padding:0}.category-index::-webkit-scrollbar{display:none}.cat-chip.active{color:var(--ink);border-color:color-mix(in srgb,var(--spark) 70%,var(--edge));box-shadow:0 0 0 1px color-mix(in srgb,var(--spark) 18%,transparent),0 12px 32px rgba(0,0,0,.20)}
.shelves{padding:10px 0 110px}
.shelf{padding:66px clamp(20px,5vw,74px) 44px;border-bottom:1px solid var(--edge);animation:shelfReveal .55s cubic-bezier(.16,.8,.2,1) both}
.shelf-head{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.shelf-head .copy p{margin:0 0 8px;color:var(--spark);font-size:10px;font-weight:900;letter-spacing:.17em}.shelf-head h2{font:700 clamp(34px,4vw,62px)/.92 Georgia,serif;margin:0;letter-spacing:-.04em}.shelf-head .meta{color:var(--muted);font-size:11px;margin-top:8px}
.density{border:1px solid var(--edge);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.10em}
.density.thin{color:#d6a24d}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:16px 0 28px;overflow:visible}.rail::-webkit-scrollbar{display:none}
.card{height:420px;position:relative;border:1px solid var(--edge);border-radius:26px;overflow:hidden;background:linear-gradient(155deg,var(--panel2),var(--panel));box-shadow:0 20px 54px rgba(0,0,0,.18);transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}.card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 36%,var(--edge));box-shadow:0 28px 68px rgba(0,0,0,.27)}
.media{position:absolute;inset:0 0 38%;background:linear-gradient(160deg,var(--media2),var(--media));display:grid;place-items:center;overflow:hidden}
.media img{width:100%;height:100%;object-fit:contain;padding:18px;filter:drop-shadow(0 20px 26px rgba(15,23,42,.18));transition:transform .5s cubic-bezier(.16,.8,.2,1)}.card:hover img{transform:scale(1.035)}
.card-body{position:absolute;left:0;right:0;bottom:0;min-height:39%;padding:18px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--panel2) 97%,transparent) 20%)}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:8px;letter-spacing:.09em;font-weight:900;border:1px solid var(--edge);border-radius:999px;padding:5px 7px;color:var(--muted)}.badge.truth{color:var(--spark)}
.card h3{font:700 18px/1.16 Georgia,serif;margin:10px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card p{font-size:10px;color:var(--muted);margin:0}
.more{display:block;margin:12px auto 0;border:1px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:11px;font-weight:850;cursor:pointer}
.more[hidden]{display:none}
.qa{position:fixed;right:16px;bottom:16px;z-index:60;border:1px solid var(--edge);border-radius:999px;padding:8px 10px;background:var(--panel);color:var(--muted);font-size:9px;letter-spacing:.09em;font-weight:850;backdrop-filter:blur(14px)}
.empty{padding:60px;color:var(--muted)}
@media(max-width:980px){.stage{grid-template-columns:1fr;min-height:auto;padding-top:62px}.hero{width:min(500px,82vw);justify-self:center}.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.shadow-note{display:none}.stage{padding:45px 17px 42px}h1{font-size:58px}.hero{width:92vw}.shelf{padding-left:17px;padding-right:17px}.rail{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{height:390px}.qa{display:none}.shelf-head{align-items:flex-start;flex-direction:column}.category-index{gap:6px}.category-index{grid-template-columns:repeat(2,minmax(0,1fr))}.cat-chip{padding:6px 8px 6px 6px!important;font-size:10px!important;min-height:46px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.hero-media.promo-floor::before{animation:none!important}.shelf{animation:none!important}}

/* V10 Visible Taxonomy Matrix — all taxonomy choices reflow; never horizontally scroll. */
.taxonomy-zone{margin-top:10px}
.dept-nav{
  display:grid!important;
  grid-template-columns:repeat(auto-fit,minmax(92px,1fr))!important;
  gap:5px 8px!important;
  overflow:visible!important;
  max-width:none!important;
  padding:0!important;
  margin:0!important;
  scrollbar-width:auto!important;
}
.dept-nav button{
  width:100%;
  min-width:0;
  padding:8px 6px!important;
  border:0!important;
  border-bottom:2px solid transparent!important;
  border-radius:0!important;
  background:transparent!important;
  white-space:normal!important;
  text-align:center;
  line-height:1.2;
}
.dept-nav button.active{
  border-bottom-color:var(--spark)!important;
  box-shadow:none!important;
  color:var(--ink)!important;
}
.category-drawer-shell{
  margin-top:8px!important;
  padding-top:8px!important;
}
.category-drawer-label{margin-bottom:6px!important}
.category-index{
  display:grid!important;
  grid-template-columns:repeat(auto-fit,minmax(118px,1fr))!important;
  gap:5px 8px!important;
  overflow:visible!important;
  max-width:none!important;
  padding:0!important;
}
.cat-chip{
  width:100%;
  min-width:0;
  min-height:34px!important;
  padding:7px 8px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  border:1px solid var(--edge)!important;
  border-radius:10px!important;
  background:color-mix(in srgb,var(--panel) 86%,transparent)!important;
  white-space:normal!important;
  overflow:visible!important;
  transform:none!important;
  box-shadow:none!important;
  text-align:center!important;
}
.cat-chip:hover{
  transform:none!important;
  border-color:color-mix(in srgb,var(--accent) 42%,var(--edge))!important;
  box-shadow:none!important;
}
.cat-chip .chip-copy{display:block!important;text-align:center!important}
.cat-chip .chip-copy strong{font-size:10px!important;line-height:1.2!important}
.cat-chip.active{
  border-color:color-mix(in srgb,var(--spark) 72%,var(--edge))!important;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--spark) 18%,transparent)!important;
}
@media(max-width:820px){
  .topbar{position:relative!important}
  .dept-nav{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .category-index{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media(max-width:520px){
  .dept-nav{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px 6px!important}
  .category-index{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:5px 6px!important}
  .dept-nav button{font-size:10.5px!important;padding:8px 4px!important}
  .cat-chip{min-height:36px!important;padding:7px 6px!important}
}


/* V10 CINEMATIC TAXONOMY COLOR LAYER */
.taxonomy-zone{
  position:relative;
  isolation:isolate;
}
.taxonomy-zone::before{
  content:"";
  position:absolute;
  inset:-8px -10px;
  pointer-events:none;
  z-index:-1;
  border-radius:18px;
  background:
    radial-gradient(circle at 18% 0%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 34%),
    radial-gradient(circle at 82% 100%,color-mix(in srgb,var(--spark) 7%,transparent),transparent 38%);
  opacity:.85;
}

/* Main categories: stronger HUNT cinematic sapphire/gold layer */
.dept-nav button{
  position:relative!important;
  overflow:hidden!important;
  border:1px solid color-mix(in srgb,var(--spark) 20%,var(--edge))!important;
  border-radius:12px!important;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--panel2) 90%,#102a52 10%),
      color-mix(in srgb,var(--panel) 84%,#07182f 16%)
    )!important;
  color:color-mix(in srgb,var(--ink) 88%,var(--spark) 12%)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 7px 18px rgba(2,9,24,.16)!important;
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease!important;
}
.dept-nav button::before{
  content:"";
  position:absolute;
  top:-120%;
  left:-42%;
  width:42%;
  height:340%;
  pointer-events:none;
  transform:rotate(22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  opacity:.34;
  transition:left .52s cubic-bezier(.2,.8,.2,1),opacity .2s ease;
}
.dept-nav button:hover::before,
.dept-nav button.active::before{
  left:108%;
  opacity:.5;
}
.dept-nav button:hover{
  transform:translateY(-1px)!important;
  border-color:color-mix(in srgb,var(--spark) 42%,var(--edge))!important;
  color:var(--ink)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.065),
    0 10px 24px rgba(6,18,42,.23),
    0 0 0 1px color-mix(in srgb,var(--spark) 9%,transparent)!important;
}
.dept-nav button.active{
  color:var(--ink)!important;
  border-color:color-mix(in srgb,var(--spark) 64%,var(--edge))!important;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--panel2) 70%,#183762 30%),
      color-mix(in srgb,var(--panel) 66%,#0a2447 34%)
    )!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 13px 30px rgba(7,20,49,.27),
    0 0 0 1px color-mix(in srgb,var(--spark) 17%,transparent),
    0 0 16px color-mix(in srgb,var(--spark) 10%,transparent)!important;
}

/* Departments/shelves: related hue, slightly lighter and more alive */
.category-index{
  position:relative;
}
.cat-chip{
  position:relative!important;
  overflow:hidden!important;
  border:1px solid color-mix(in srgb,var(--accent) 22%,var(--edge))!important;
  border-radius:11px!important;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--panel2) 82%,#12344a 18%),
      color-mix(in srgb,var(--panel) 77%,#0b283a 23%)
    )!important;
  color:color-mix(in srgb,var(--ink) 80%,var(--spark) 20%)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    0 6px 15px rgba(3,12,24,.13)!important;
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease!important;
}
.cat-chip::before{
  content:"";
  position:absolute;
  inset:-42% -18%;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 32%,rgba(255,255,255,.12),transparent 24%),
    linear-gradient(118deg,
      transparent 26%,
      rgba(255,255,255,.00) 35%,
      rgba(255,255,255,.11) 48%,
      rgba(255,255,255,.00) 61%,
      transparent 74%);
  transform:translateX(-30%);
  opacity:.40;
  transition:transform .48s cubic-bezier(.2,.8,.2,1),opacity .2s ease;
}
.cat-chip:hover::before,
.cat-chip.active::before{
  transform:translateX(30%);
  opacity:.58;
}
.cat-chip:hover{
  transform:translateY(-1px)!important;
  border-color:color-mix(in srgb,var(--accent) 46%,var(--edge))!important;
  color:var(--ink)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075),
    0 9px 20px rgba(5,18,30,.20),
    0 0 0 1px color-mix(in srgb,var(--accent) 9%,transparent)!important;
}
.cat-chip.active{
  color:var(--ink)!important;
  border-color:color-mix(in srgb,var(--spark) 52%,var(--edge))!important;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--panel2) 68%,#1a4158 32%),
      color-mix(in srgb,var(--panel) 64%,#0d3149 36%)
    )!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.085),
    0 11px 24px rgba(5,20,34,.22),
    0 0 0 1px color-mix(in srgb,var(--spark) 13%,transparent),
    0 0 14px color-mix(in srgb,var(--accent) 11%,transparent)!important;
}
.cat-chip .chip-copy{
  position:relative!important;
  z-index:1!important;
}
@media(prefers-reduced-motion:reduce){
  .dept-nav button::before,.cat-chip::before{transition:none!important}
  .dept-nav button:hover::before,.dept-nav button.active::before,
  .cat-chip:hover::before,.cat-chip.active::before{transform:none!important}
}


/* V10 TAXONOMY ROW SEPARATION */
/* Make the two taxonomy levels instantly distinguishable. */
.taxonomy-zone{
  display:grid;
  gap:8px;
}

/* Row 1 — Main Categories: stronger cinematic rail */
#dept-nav{
  position:relative;
  padding:8px!important;
  border:1px solid color-mix(in srgb,var(--spark) 22%,var(--edge))!important;
  border-radius:14px!important;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--panel2) 82%,#0c2348 18%),
      color-mix(in srgb,var(--panel) 76%,#07162f 24%)
    )!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 10px 26px rgba(2,9,24,.18),
    0 0 18px color-mix(in srgb,var(--spark) 6%,transparent)!important;
  overflow:hidden!important;
}
#dept-nav::before{
  content:"";
  position:absolute;
  inset:-60% -20%;

  ["watches",/\b(watch|watches|wristwatch)\b/i],
  ["sunglasses",/\b(sunglass|sunglasses|sun glasses)\b/i],
  ["underwear",/\b(boxer|boxers|brief|briefs|underwear|underpants|trunks)\b/i],
  ["hoodies",/\b(hoodie|hoodies|sweatshirt|sweatshirts)\b/i],
  ["knitwear",/\b(sweater|sweaters|cardigan|cardigans|knitwear|pullover)\b/i],
  ["jackets",/\b(jacket|jackets|coat|coats|parka|windbreaker|bomber|trench)\b/i],
  ["skirts",/\b(skirt|skirts)\b/i],
  ["lighting",/\b(lamp|lamps|lighting|night light|desk light|ceiling light|led light)\b/i],
  ["kitchen",/\b(kitchen|cookware|utensil|bakeware|lunch box|food storage)\b/i],
  ["storage",/\b(storage|organizer|closet|rack|shelf|shelving)\b/i]
];
function exactIdentity(slug,p){
  const s=normalizeSlug(slug),t=textOf(p);
  const rule=exactRules.find(([id])=>id===s);
  if(rule){if(rule[2]&&rule[2].test(t))return false;return rule[1].test(t)}
  if(s==="accessories"){
    if(/\b(sock|socks|earring|necklace|pendant|bracelet|bangle|ring|anklet|brooch|handbag|purse|tote|crossbody|backpack|hat|cap|beanie|watch|sunglass|shoe|sneaker|swimwear|swimsuit)\b/i.test(t))return false;
    if(/\b(laptop|cooling pad|chair|tent|gazebo|brake|hitch|winch|engine|exhaust|cleaner|steam mop|kitchen|lamp|lighting|storage rack|gaming|controller|phone case)\b/i.test(t))return false;
    return /\b(belt|wallet|card holder|scarf|shawl|glove|gloves|tie|bow tie|keychain|key chain|key ring|cufflink|cufflinks|suspender|suspenders|pocket square)\b/i.test(t);
  }
  return true;
}
function sourceAlias(provider){const v=String(provider||"").toLowerCase();if(v.includes("cj"))return"h1";if(v.includes("eprolo"))return"h2";if(v.includes("printful"))return"h3";if(v.includes("gooten"))return"h4";return""}
function allowedForShelf(deptSlug,cat,p){
  if(!p?.item_id||blockedPreview.test(textOf(p)))return false;
  if(!exactIdentity(cat.slug,p))return false;
  const owner=canonicalOverrides.get(key(p));
  return !owner||owner===deptSlug+"/"+cat.slug;
}
function directCategoryProducts(deptSlug,cat){
  const route=deptSlug+"/"+cat.slug;
  const rows=[...(cat.products||[]),...(taxonomySupplement.shelves?.[route]||[]),...(launchSupplement.shelves?.[route]||[])];
  const seen=new Set(),out=[];
  for(const p of rows){const k=key(p);if(seen.has(k)||!allowedForShelf(deptSlug,cat,p))continue;seen.add(k);out.push(p)}
  return out;
}
function titleFromSlug(slug){return String(slug||"").replace(/^(men|women)-/,"").split("-").map(x=>x?x[0].toUpperCase()+x.slice(1):"").join(" ")}
function mergeSupplementCategories(){
  for(const source of [taxonomySupplement,launchSupplement]){
    for(const route of Object.keys(source?.shelves||{})){
      const slash=route.indexOf("/");if(slash<1)continue;
      const deptSlug=route.slice(0,slash),catSlug=route.slice(slash+1);
      const d=data.departments.find(x=>x.slug===deptSlug);if(!d)continue;
      if(!d.categories.some(x=>x.slug===catSlug))d.categories.push({slug:catSlug,title:titleFromSlug(catSlug),products:[]});
    }
  }
}
function buildRouteOwners(){
  canonicalOverrides=new Map();
  for(const source of [taxonomySupplement,launchSupplement]){
    for(const [route,products] of Object.entries(source?.shelves||{})){
      for(const p of products||[]){if(p?.item_id)canonicalOverrides.set(key(p),route)}
    }
  }
}
function ensureJewelryDepartment(){
  if(data.departments.some(d=>d.slug==="jewelry"))return;
  const raw=[],seen=new Set();
  for(const d of data.departments){
    for(const cat of d.categories||[]){
      const route=d.slug+"/"+cat.slug;
      for(const p of [...(cat.products||[]),...(taxonomySupplement.shelves?.[route]||[]),...(launchSupplement.shelves?.[route]||[])]){
        const k=key(p);if(seen.has(k)||!p?.item_id||blockedPreview.test(textOf(p)))continue;
        if(!/\b(jewelry|jewellery|earring|necklace|pendant|choker|bracelet|bangle|ring|anklet|brooch)\b/i.test(textOf(p)))continue;
        seen.add(k);raw.push(p)
      }
    }
  }
  const claimed=new Set(),categories=[];
  for(const [slug,title,re] of jewelryRules){
    const products=[];
    for(const p of raw){const k=key(p);if(claimed.has(k)||!re.test(textOf(p)))continue;claimed.add(k);canonicalOverrides.set(k,"jewelry/"+slug);products.push({...p,category:slug,category_title:title})}
    if(products.length)categories.push({slug,title,products})
  }
  if(categories.length)data.departments.push({slug:"jewelry",title:"Jewelry",categories,category_rails:categories.length,hero:null})
}
function categoriesFor(d){
  return (d.categories||[]).filter(cat=>{
    const s=normalizeSlug(cat.slug);
    if(s==="clothing")return false;
    return directCategoryProducts(d.slug,cat).length>0;
  })
}
function card(p,d,cat){
  const href="product-cinematic-v10.html?src="+encodeURIComponent(sourceAlias(p.provider))+"&id="+encodeURIComponent(String(p.item_id||""));
  return '<a class="card product-card" href="'+href+'" data-product-provider="'+esc(p.provider)+'" data-product-id="'+esc(p.item_id)+'" data-product-dept="'+esc(d.slug)+'" data-product-shelf="'+esc(cat.slug)+'"><div class="media"><img loading="lazy" src="'+esc(p.image_url)+'" alt="'+esc(p.title||"Product")+'"></div><div class="card-body"><div class="badges"><span class="badge truth">'+esc(d.title+" / "+cat.title)+'</span><span class="badge">'+esc(p.provider||"HUNT")+'</span></div><h3>'+esc(p.title||"Product")+'</h3><p>Exact shelf · Production off</p></div></a>';
}
function rowsForView(d,cat){
  const base=directCategoryProducts(d.slug,cat);
  let rows=[...base];
  if(stockOnly)rows=rows.filter(p=>Number.isFinite(Number(p?.verified_inventory))&&Number(p.verified_inventory)>0);
  if(sortMode==="az")rows.sort((a,b)=>String(a?.title||"").localeCompare(String(b?.title||""),undefined,{sensitivity:"base"}));
  return {base,rows};
}
function renderCategory(cat,d){
  const view=rowsForView(d,cat),all=view.rows,base=view.base,n=visible[cat.slug]||Math.min(24,all.length);
  const products=all.slice(0,n).map(p=>card(p,d,cat)).join("");
  const density=base.length>=24?"FULL":base.length>=12?"GOOD":base.length?"THIN":"EMPTY";
  const hasInventory=base.some(p=>Number.isFinite(Number(p?.verified_inventory)));
  const tools='<div class="shop-tools" aria-label="Product list tools">'+
    '<span class="route-note">'+esc(d.title)+' / '+esc(cat.title)+'</span>'+
    '<button type="button" class="filter-trigger" data-filter-toggle aria-expanded="'+String(filterOpen)+'" aria-controls="filter-panel">Filter</button>'+
    '<label class="sort-wrap">Sort <select class="sort-select" data-sort aria-label="Sort products">'+
      '<option value="featured" '+(sortMode==="featured"?"selected":"")+'>Featured</option>'+
      '<option value="az" '+(sortMode==="az"?"selected":"")+'>Name A–Z</option>'+
    '</select></label>'+
    '<div class="filter-panel" id="filter-panel" '+(filterOpen?"":"hidden")+'>'+
      (hasInventory?'<label class="filter-check"><input type="checkbox" data-stock-only '+(stockOnly?"checked":"")+'> Verified in stock</label>':'<span class="filter-note">No verified shelf filters available yet.</span>')+
    '</div></div>';
  const empty=all.length?'':'<div class="empty">No products match the selected verified filter.</div>';
  return '<section class="shelf" id="selected-shelf"><div class="shelf-head"><div class="copy"><p>EXACT DEPARTMENT</p><h2>'+esc(cat.title)+'</h2><div class="meta">'+base.length+' clean candidates · '+Math.min(n,all.length)+' shown · '+esc(d.title)+' only</div></div><span class="density '+((density==="THIN"||density==="EMPTY")?"thin":"")+'">'+density+'</span></div>'+tools+empty+'<div class="rail">'+products+'</div><button class="more" data-more="'+esc(cat.slug)+'" '+(n>=all.length?"hidden":"")+'>Load 24 more</button></section>';
}
const campaignModes=[
  {title:"THE NIGHT EDIT",sub:"HUNT · EDITORIAL CAMPAIGN"},
  {title:"WORLD OF HUNT",sub:"GLOBAL FINDS · CURATED STORIES"},
  {title:"NEW SEASON",sub:"DISCOVER · SAVE · HUNT"}
];
function promoProducts(d){
  const rows=[],seen=new Set();
  for(const cat of categoriesFor(d)){
    for(const p of directCategoryProducts(d.slug,cat)){
      const k=key(p);if(seen.has(k)||!p.image_url)continue;
      seen.add(k);rows.push(p);
      if(rows.length>=6)return rows;
    }
  }
  return rows;
}
function paintCampaign(d){
  const modes=campaignModes,mode=modes[campaignIndex%modes.length],rows=promoProducts(d);
  $("#promo-mark").innerHTML=esc(mode.title)+'<span>'+esc(d.title+' · '+mode.sub)+'</span><div class="campaign-dots" id="campaign-dots">'+modes.map((_,i)=>'<i class="'+(i===campaignIndex%modes.length?'active':'')+'"></i>').join("")+'</div>';
  const nodes=[...document.querySelectorAll(".promo-object")];
  nodes.forEach((node,i)=>{
    const p=rows[(campaignIndex+i)%Math.max(1,rows.length)];
    const img=node.querySelector("img");
    if(p?.image_url){img.src=p.image_url;img.alt=p.title||"";node.classList.remove("show");requestAnimationFrame(()=>node.classList.add("show"))}
    else node.classList.remove("show");
  });
  $("#hero-kicker").textContent="HUNT PROMOTIONS · "+String(campaignIndex%3+1).padStart(2,"0");
  $("#hero-title").textContent=mode.title;
  $("#hero-status").textContent="Living campaign · "+d.title+" · advertising / editorial floor · products below remain exact-shelf only";
}
function startCampaign(d){
  if(campaignTimer)clearInterval(campaignTimer);
  paintCampaign(d);
  campaignTimer=setInterval(()=>{campaignIndex=(campaignIndex+1)%campaignModes.length;paintCampaign(d)},6500);
}
function renderPromo(d){
  $("#eyebrow").textContent="HUNT CINEMATIC · "+String(d.title||"").toUpperCase();
  $("#title").textContent=d.title;
  $("#lede").textContent="Choose a department above. This main cinematic screen stays reserved for HUNT advertising, promotions and campaign storytelling.";
  $("#stats").innerHTML=[
    "Original Cinematic preserved",
    categoriesFor(d).length+" departments available",
    "Advertising / Promotions floor",
    "Production off"
  ].map(x=>'<span class="stat">'+esc(x)+'</span>').join("");
  $("#hero").hidden=false;
  startCampaign(d);
}
function syncUrl(d){
  const q=new URLSearchParams(location.search);q.set("dept",d.slug);
  if(selectedShelf)q.set("shelf",selectedShelf);else q.delete("shelf");
  history.replaceState(null,"",location.pathname+"?"+q.toString())
}
function render(){
  const d=data.departments[active];if(!d)return;
  document.title="HUNT · "+d.title+" · Original Cinematic Preview";
  [...$("#dept-nav").children].forEach((b,i)=>{const on=i===active;b.classList.toggle("active",on);b.setAttribute("aria-pressed",String(on));b.setAttribute("aria-current",on?"page":"false")});
  renderPromo(d);
  const cats=categoriesFor(d);
  $("#category-drawer-label").textContent=d.title+" · departments";
  $("#category-index").innerHTML=cats.map(cat=>{
    const on=selectedShelf===cat.slug;
    return '<button type="button" class="cat-chip '+(on?"active":"")+'" data-cat="'+esc(cat.slug)+'" aria-pressed="'+String(on)+'" aria-current="'+(on?"page":"false")+'">'+
      '<span class="chip-copy"><strong>'+esc(cat.title)+'</strong></span>'+
    '</button>'
  }).join("");
  const selected=cats.find(x=>x.slug===selectedShelf);
  $("#shelves").innerHTML=selected?renderCategory(selected,d):'<div class="empty">Choose a '+esc(d.title)+' department above. Products will appear below the promotions floor.</div>';
  syncUrl(d)
}
$("#dept-nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-i]");if(!b)return;
  active=Number(b.dataset.i)||0;selectedShelf="";visible={};sortMode="featured";stockOnly=false;filterOpen=false;campaignIndex=0;render()
});
$("#category-index").addEventListener("click",e=>{
  const b=e.target.closest("button[data-cat]");if(!b)return;
  selectedShelf=String(b.dataset.cat||"");visible={};sortMode="featured";stockOnly=false;filterOpen=false;render()
});
$("#shelves").addEventListener("click",e=>{
  const filter=e.target.closest("button[data-filter-toggle]");
  if(filter){filterOpen=!filterOpen;filter.setAttribute("aria-expanded",String(filterOpen));const panel=$("#filter-panel");if(panel)panel.hidden=!filterOpen;return}
  const more=e.target.closest("button[data-more]");
  if(more){const d=data.departments[active],cat=categoriesFor(d).find(x=>x.slug===more.dataset.more);if(!cat)return;const total=rowsForView(d,cat).rows.length;visible[cat.slug]=Math.min((visible[cat.slug]||24)+24,total);render();return}
  const a=e.target.closest("a.product-card");if(!a)return;
  const d=data.departments[active],cat=categoriesFor(d).find(x=>x.slug===selectedShelf);if(!cat)return;
  const p=directCategoryProducts(d.slug,cat).find(x=>String(x.provider||"")===String(a.dataset.productProvider||"")&&String(x.item_id||"")===String(a.dataset.productId||""));
  if(p){const routed={...p,hunt_department:d.slug,hunt_shelf:cat.slug,canonical_department:d.slug,canonical_shelf:cat.slug};try{sessionStorage.setItem("hunt_product_"+p.provider+":"+p.item_id,JSON.stringify(routed))}catch{}}
});
$("#shelves").addEventListener("change",e=>{
  if(e.target.matches("select[data-sort]")){sortMode=String(e.target.value||"featured");visible={};render();return}
  if(e.target.matches("input[data-stock-only]")){stockOnly=Boolean(e.target.checked);visible={};render()}
});
Promise.all([
  fetch("./evidence/HUNT-FULL-SHELVES-STYLIST-SHADOW-2026-09-23.json").then(r=>r.json()),
  fetch("./evidence/HUNT-TAXONOMY-PROFIT-V2-PREVIEW-SUPPLEMENT-2026-09-27.json").then(r=>r.ok?r.json():({shelves:{}})).catch(()=>({shelves:{}})),
  fetch("./evidence/HUNT-MEN-LAUNCH-LOCKED-SUPPLEMENT-2026-09-28.json").then(r=>r.ok?r.json():({shelves:{}})).catch(()=>({shelves:{}}))
]).then(([j,s1,s2])=>{
  data=j;taxonomySupplement=s1||{shelves:{}};launchSupplement=s2||{shelves:{}};
  mergeSupplementCategories();buildRouteOwners();ensureJewelryDepartment();
  $("#dept-nav").innerHTML=data.departments.map((d,i)=>'<button type="button" data-i="'+i+'" aria-pressed="false">'+esc(d.title)+'</button>').join("");
  const requested=qp.get("dept"),idx=data.departments.findIndex(x=>x.slug===requested);active=idx>=0?idx:0;
  const requestedShelf=qp.get("shelf");selectedShelf=requestedShelf||"";
  setTheme(qp.get("theme")==="light"?"light":"dark");render()
}).catch(err=>{$("#shelves").innerHTML='<div class="empty">Preview failed: '+esc(err.message)+'</div>'});
</script>
