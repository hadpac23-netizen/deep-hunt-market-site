name: HUNT freshness smoke

on:
  push:
    branches:
      - "launch/hunt-candidate-2026-09-29-v1"
    paths:
      - "scripts/hunt-freshness-smoke.mjs"
      - ".github/workflows/hunt-freshness-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Read-only freshness smoke
        run: node scripts/hunt-freshness-smoke.mjs
