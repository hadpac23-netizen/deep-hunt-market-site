name: HUNT live shelf audit

on:
  push:
    branches:
      - "launch/hunt-candidate-2026-09-29-v1"
    paths:
      - "scripts/hunt-live-shelf-audit.mjs"
      - ".github/workflows/hunt-live-shelf-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-shelf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit jewelry-rings variants read-only
        run: node scripts/hunt-live-shelf-audit.mjs
