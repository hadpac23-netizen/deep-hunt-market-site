name: HUNT PR26 Reorder EPROLO Shelves Once

on:
  push:
    branches:
      - launch/hunt-candidate-2026-09-29-v1
    paths:
      - '.github/workflows/hunt-pr26-reorder-eprolo-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: launch/hunt-candidate-2026-09-29-v1
          fetch-depth: 0
      - name: Preserve live and persisted shelf priority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/hunt-storefront/runtime.ts')
          s=p.read_text()
          old='const mergedShelves = mergeMarketShelves(priorityCjShelves, eproloCanonical.shelves, cjShelves, persistedShelves, merchantShelves, printfulShelves, gootenShelves, matterhornShelves, surveyShelves);'
          new='const mergedShelves = mergeMarketShelves(priorityCjShelves, cjShelves, persistedShelves, eproloCanonical.shelves, merchantShelves, printfulShelves, gootenShelves, matterhornShelves, surveyShelves);'
          if s.count(old)!=1:
            raise SystemExit(f'expected exactly one merge anchor, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -F 'mergeMarketShelves(priorityCjShelves, cjShelves, persistedShelves, eproloCanonical.shelves' supabase/functions/hunt-storefront/runtime.ts
      - name: Commit PR26-only priority fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/hunt-storefront/runtime.ts
          git commit -m 'fix(catalog): preserve verified shelf source priority'
          git push origin HEAD:launch/hunt-candidate-2026-09-29-v1
