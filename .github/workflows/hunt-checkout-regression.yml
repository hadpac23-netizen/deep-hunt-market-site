name: HUNT checkout regression

on:
  pull_request:
    paths:
      - "checkout.html"
      - "checkout.js"
      - "checkout-address.js"
      - "hunt-shop.css"
      - "supabase/functions/hunt-cj-quote/**"
      - "supabase/functions/hunt-cj-live-check/**"
      - "supabase/functions/hunt-eprolo-readonly-pilot/**"
      - "supabase/functions/hunt-eprolo-variant-country-audit-shadow/**"
      - "supabase/functions/hunt-eprolo-product-country-variants-audit-shadow/**"
      - "supabase/functions/hunt-payment-session/**"
      - "supabase/functions/hunt-order-preview/**"
      - "supabase/functions/hunt-payplus-callback/**"
      - "supabase/functions/hunt-payplus-sandbox-evidence/**"
      - "supabase/functions/hunt-order-orchestrator/**"
      - "supabase/functions/hunt-storefront/**"
      - "supabase/functions/hunt-eprolo-country-shadow/**"
      - "supabase/functions/hunt-supplier-ops-watch-shadow/**"
      - "supabase/functions/hunt-freshness-shadow-runner/**"
      - "supabase/functions/hunt-refund-preview/**"
      - "supabase/functions/_shared/order-lifecycle.mjs"
      - "supabase/functions/_shared/hunt-fulfillment-provider.mjs"
      - "tests/**"
      - "ops/**"
      - "catalog-index.json"
      - "catalog-readiness.json"
      - ".github/workflows/hunt-checkout-regression.yml"
  push:
    branches:
      - "feature/hunt-shipping-address-e2e"
    paths:
      - "checkout.html"
      - "checkout.js"
      - "checkout-address.js"
      - "hunt-shop.css"
      - "supabase/functions/hunt-payment-session/**"
      - "supabase/functions/hunt-order-preview/**"
      - "supabase/functions/hunt-payplus-callback/**"
      - "supabase/functions/hunt-payplus-sandbox-evidence/**"
      - "supabase/functions/hunt-order-orchestrator/**"
      - "supabase/functions/hunt-refund-preview/**"
      - "supabase/functions/_shared/order-lifecycle.mjs"
      - "tests/**"
      - ".github/workflows/hunt-checkout-regression.yml"

permissions:
  contents: read

jobs:
  checkout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Run checkout tests
        run: node --test tests/checkout-address.test.js tests/checkout-contract.test.js tests/payplus-auth.test.js tests/payplus-status-map.test.js tests/payplus-callback-contract.test.js tests/order-lifecycle.test.js tests/order-lifecycle-contract.test.js tests/payment-live-kill-switch.test.js tests/eprolo-fulfillment-shadow.test.js tests/eprolo-storefront-launch-gate.test.js tests/canonical-pdp-readiness-contract.test.js tests/no-legacy-catalog-launch-path.test.js tests/cj-sandbox-resilience-contract.test.js tests/presupplier-recheck-contract.test.js tests/cj-pdp-stock-truth-contract.test.js tests/eprolo-country-fresh-truth.test.js tests/supplier-ops-watch-contract.test.js tests/runtime-source-manifest.test.js tests/eprolo-order-contract-blocker.test.js tests/freshness-shadow-runner.test.js tests/launch-closure-matrix.test.js tests/red-team-closure-contract.test.js tests/canonical-pdp-predicate-drift.test.js tests/red-team-minor-closure.test.js tests/eprolo-country-tax-truth.test.js tests/storefront-source-layout.test.js
      - name: Parse browser scripts
        run: |
          node -e "new Function(require('fs').readFileSync('checkout-address.js','utf8')); new Function(require('fs').readFileSync('checkout.js','utf8')); console.log('browser-js-parse-pass')"
