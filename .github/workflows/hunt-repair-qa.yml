name: HUNT Repair QA
on:
  pull_request:
  push:
    branches:
      - main
      - feature/hunt-final-candidate-v1
  workflow_dispatch:
jobs:
  repair-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax
        run: |
          node --check product.js
          node --check checkout.js
          node --check boom-brain-studio.js
      - name: Repair contracts
        run: |
          node hunt-product-media-selection.test.js
          node hunt-product-checkout-integrity.test.js
          node boom-commerce-profit.test.mjs
          node boom-commerce-handoff.test.js
          node boom-payment-order-state.test.js
          node boom-brain-registry.test.js
          node hunt-global-checkout-search.test.js
          node hunt-system-completion.test.cjs
      - name: Repair team contract
        run: node boom-repair-team.test.js
