name: HUNT EPROLO load baseline

on:
  push:
    branches:
      - "launch/hunt-candidate-2026-09-29-v1"
    paths:
      - "scripts/hunt-eprolo-load-baseline.mjs"
      - ".github/workflows/hunt-eprolo-load-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Read-only EPROLO storefront load baseline
        run: node scripts/hunt-eprolo-load-baseline.mjs
