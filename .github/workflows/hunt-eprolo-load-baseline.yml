name: HUNT EPROLO load baseline

on:
  push:
    branches:
      - "launch/hunt-candidate-2026-09-29-v1"
    paths:
      - "scripts/hunt-eprolo-load-baseline.mjs"
      - ".github/workflows/hunt-eprolo-load-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Read-only EPROLO storefront load baseline
        run: node scripts/hunt-eprolo-load-baseline.mjs
