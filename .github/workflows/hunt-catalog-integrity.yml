name: HUNT Catalog Integrity

on:
  push:
    paths:
      - 'supabase/functions/hunt-eprolo-catalog-fill-readonly/**'
      - 'supabase/functions/hunt-eprolo-shelves-readonly/**'
      - 'supabase/functions/hunt-storefront/runtime.ts'
      - 'supabase/functions/hunt-storefront/eprolo-shelves.ts'
      - 'eprolo-shelves-bridge.js'
      - 'canonical-taxonomy.js'
      - 'category.html'
      - 'product.html'
      - 'auth.js'
      - 'pwa.js'
      - 'service-worker.js'
      - 'storefront-privacy.js'
      - 'tests/eprolo-catalog-fill-integrity.test.js'
      - 'tests/eprolo-live-shelves-bridge.test.js'
      - 'tests/storefront-provider-privacy.test.js'
      - 'tests/storefront-shell-readiness.test.js'
      - 'tests/canonical-taxonomy-ui.test.js'
      - 'tests/canonical-taxonomy-contract.test.js'
      - '.github/workflows/hunt-catalog-integrity.yml'
  pull_request:
    paths:
      - 'supabase/functions/hunt-eprolo-catalog-fill-readonly/**'
      - 'supabase/functions/hunt-eprolo-shelves-readonly/**'
      - 'supabase/functions/hunt-storefront/runtime.ts'
      - 'supabase/functions/hunt-storefront/eprolo-shelves.ts'
      - 'eprolo-shelves-bridge.js'
      - 'canonical-taxonomy.js'
      - 'category.html'
      - 'product.html'
      - 'auth.js'
      - 'pwa.js'
      - 'service-worker.js'
      - 'storefront-privacy.js'
      - 'tests/eprolo-catalog-fill-integrity.test.js'
      - 'tests/eprolo-live-shelves-bridge.test.js'
      - 'tests/storefront-provider-privacy.test.js'
      - 'tests/storefront-shell-readiness.test.js'
      - 'tests/canonical-taxonomy-ui.test.js'
      - 'tests/canonical-taxonomy-contract.test.js'
      - '.github/workflows/hunt-catalog-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: node --check auth.js && node --check pwa.js && node --check service-worker.js && node --check storefront-privacy.js && node --check canonical-taxonomy.js
      - run: node --test tests/eprolo-catalog-fill-integrity.test.js tests/eprolo-live-shelves-bridge.test.js tests/storefront-provider-privacy.test.js tests/storefront-shell-readiness.test.js tests/canonical-taxonomy-ui.test.js tests/canonical-taxonomy-contract.test.js
