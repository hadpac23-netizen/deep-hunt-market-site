name: HUNT Catalog Integrity

on:
  push:
    paths:
      - 'supabase/functions/hunt-eprolo-catalog-fill-readonly/**'
      - 'tests/eprolo-catalog-fill-integrity.test.js'
      - '.github/workflows/hunt-catalog-integrity.yml'
  pull_request:
    paths:
      - 'supabase/functions/hunt-eprolo-catalog-fill-readonly/**'
      - 'tests/eprolo-catalog-fill-integrity.test.js'
      - '.github/workflows/hunt-catalog-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test tests/eprolo-catalog-fill-integrity.test.js
