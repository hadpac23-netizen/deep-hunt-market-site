name: HUNT CJ launch core live audit

on:
  push:
    branches:
      - "launch/hunt-candidate-2026-09-29-v1"
    paths:
      - "scripts/hunt-cj-launch-core-live-audit.mjs"
      - ".github/workflows/hunt-cj-launch-core-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Audit 63 CJ exact variants read-only
        run: node scripts/hunt-cj-launch-core-live-audit.mjs
