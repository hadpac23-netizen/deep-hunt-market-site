name: PR26 Pooler env direct fix

on:
  push:
    branches:
      - launch/hunt-candidate-2026-09-29-v1
    paths:
      - .github/workflows/pr26-pooler-env-direct-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/hunt-candidate-2026-09-29-v1
          fetch-depth: 0
      - name: Patch pooler env handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("supabase/functions/hunt-storefront/runtime.ts")
          text = runtime.read_text()
          old_url = 'return env("SUPABASE_DB_POOLER_URL") || env("SUPABASE_DB_URL");'
          new_url = 'return env("HUNT_DB_POOLER_URL") || env("SUPABASE_DB_POOLER_URL") || env("SUPABASE_DB_URL");'
          old_mode = 'if (env("SUPABASE_DB_POOLER_URL")) return "transaction_pooler";'
          new_mode = 'if (env("HUNT_DB_POOLER_URL") || env("SUPABASE_DB_POOLER_URL")) return "transaction_pooler";'
          if text.count(old_url) != 1 or text.count(old_mode) != 1:
              raise SystemExit("runtime anchors did not match exactly once")
          runtime.write_text(text.replace(old_url, new_url).replace(old_mode, new_mode))

          index = Path("supabase/functions/hunt-storefront/index.ts")
          idx = index.read_text()
          if idx.count('Deno.env.set("SUPABASE_DB_POOLER_URL", huntDbPoolerUrl);') != 1:
              raise SystemExit("index Deno.env.set anchor did not match exactly once")
          if idx.count('await import("./runtime.ts");') != 1:
              raise SystemExit("index runtime import anchor did not match exactly once")
          index.write_text('// Runtime reads HUNT_DB_POOLER_URL directly; Supabase Edge Runtime does not support Deno.env.set().\nawait import("./runtime.ts");\n')
          PY

          git diff --check
          git diff -- supabase/functions/hunt-storefront/index.ts supabase/functions/hunt-storefront/runtime.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/hunt-storefront/index.ts supabase/functions/hunt-storefront/runtime.ts
          git commit -m "fix(hunt): read pooler secret directly in edge runtime"
          git push origin HEAD:launch/hunt-candidate-2026-09-29-v1
