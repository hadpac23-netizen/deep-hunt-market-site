<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOM Studio Device Browser QA</title>
<style>body{font-family:system-ui;background:#111;color:#eee}.frame{position:absolute;left:-9999px;top:0;border:0}.ok{color:#8f8}.bad{color:#f88}pre{white-space:pre-wrap}</style>
</head><body data-qa="running">
<h1>BOOM Studio Device Browser QA</h1><pre id="qa-result">RUNNING</pre>
<script>
(async()=>{
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const widths=[390,768,1280,1440];
 const results=[];
 for(const width of widths){
   const frame=document.createElement("iframe"); frame.className="frame"; frame.style.width=width+"px"; frame.style.height=(width===390?844:width===768?1024:900)+"px";
   frame.src="boom-ai-studio.html?preview=1&deviceqa="+width; document.body.appendChild(frame);
   await new Promise(resolve=>frame.addEventListener("load",resolve,{once:true}));
   await wait(500);
   const d=frame.contentDocument,w=frame.contentWindow;
   const root=d.documentElement, body=d.body;
   const app=d.querySelector(".app-shell");
   const groups=d.querySelectorAll(".studio-node-group").length;
   const audit=d.querySelector("#prompt-coverage-audit");
   const trace=d.querySelector("#product-trace-workspace");
   const status=d.querySelector("#live-status")?.textContent?.trim()||"";
   const bodyOverflow=Math.max(root.scrollWidth,body?.scrollWidth||0)-Math.max(root.clientWidth,w.innerWidth);
   const keyVisible=[app,audit,trace].every(el=>el&&getComputedStyle(el).display!=="none");
   const pass=Boolean(keyVisible&&groups===6&&status.includes("LOCAL PREVIEW")&&bodyOverflow<=2);
   results.push({width,pass,groups,status,bodyOverflow,clientWidth:root.clientWidth,scrollWidth:root.scrollWidth});
   frame.remove();
 }
 const pass=results.every(x=>x.pass);
 document.body.dataset.qa=pass?"pass":"fail";
 document.querySelector("#qa-result").textContent=(pass?"PASS":"FAIL")+"\n"+JSON.stringify({pass,results},null,2);
})().catch(err=>{document.body.dataset.qa="fail";document.querySelector("#qa-result").textContent="FAIL\n"+String(err?.stack||err)});
</script></body></html>
