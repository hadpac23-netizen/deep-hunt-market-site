<title>BOOM Stylist Shadow Look Board</title>
<style>
:root{
  --bg:#f4f1ea;--panel:#fbf8f2;--panel2:#eee9df;--ink:#172033;--muted:#6a7280;
  --edge:rgba(23,32,51,.10);--gold:#b57a1d;--blue:#0d4dba;--shadow:0 24px 60px rgba(50,56,70,.12);
}
html[data-theme="dark"]{
  --bg:#020612;--panel:#08122f;--panel2:#0b1633;--ink:#f7f8fb;--muted:#aeb7cc;
  --edge:rgba(255,255,255,.11);--gold:#e7b248;--blue:#5a8dff;--shadow:0 32px 80px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
body{margin:0;background:
radial-gradient(65% 35% at 10% 0%,rgba(34,86,190,.10),transparent 70%),
radial-gradient(55% 28% at 90% 0%,rgba(181,122,29,.09),transparent 70%),var(--bg);
color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(1540px,calc(100% - 48px));margin:0 auto;padding:34px 0 90px}
header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:800}
h1{font-family:Georgia,serif;font-size:42px;margin:8px 0 6px;line-height:1}
header p{margin:0;color:var(--muted)}
.badge{border:1px solid var(--edge);background:var(--panel);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:var(--shadow)}
.look{background:linear-gradient(155deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:28px;padding:22px;margin:18px 0 28px;box-shadow:var(--shadow)}
.look-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}
.look-head h2{margin:0;font-size:24px}.look-head small{color:var(--muted)}
.status{font-size:11px;font-weight:900;letter-spacing:.08em;border:1px solid var(--edge);padding:8px 10px;border-radius:999px;background:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--edge);background:var(--panel);border-radius:20px;overflow:hidden;min-width:0}
.media{height:260px;background:
radial-gradient(circle at 50% 42%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.78) 32%,transparent 64%),
linear-gradient(160deg,#fbfaf6,#f0ede6);
display:grid;place-items:center;padding:14px}
.media img{width:100%;height:100%;object-fit:contain;mix-blend-mode:normal;opacity:1;filter:drop-shadow(0 18px 24px rgba(15,23,42,.18))}
.meta{padding:13px 14px 15px}.role{font-size:10px;letter-spacing:.15em;color:var(--gold);font-weight:900;text-transform:uppercase}
.title{font-weight:800;font-size:14px;line-height:1.25;margin:7px 0 8px;min-height:35px}
.detail{font-size:11px;color:var(--muted);line-height:1.45}.scope{font-size:10px;margin-top:8px;color:var(--blue);font-weight:800}
footer{color:var(--muted);font-size:12px;padding:10px 2px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.media{height:220px}}
</style>
</head>

const data=JSON.parse(document.querySelector("#data").textContent);
const qs=new URLSearchParams(location.search); const theme=qs.get("theme")==="dark"?"dark":"light";

 const status=states[look.id.replace("-","_")]||"SHADOW QA";
 return '<section class="look"><div class="look-head"><div><h2>'+look.id+' · '+look.audience.replaceAll("_"," ")+'</h2><small>'+look.occasion.replaceAll("_"," ")+'</small></div><span class="status">'+status+'</span></div><div class="grid">'+look.items.map(item=>{
  const v=item.visual||{};
  const detail=[v.color&&('Color: '+v.color),v.size&&('Size: '+v.size)].filter(Boolean).join(' · ');
  return '<article class="card"><div class="media"><img src="'+v.image_url+'" alt=""></div><div class="meta"><div class="role">'+item.role+'</div><div class="title">'+item.title+'</div><div class="detail">'+(detail||'Catalog/base visual')+'</div><div class="scope">'+(v.exact_variant?'EXACT VARIANT':'PRINTFUL BASE IMAGE')+'</div></div></article>';
 }).join("")+'</div></section>';
}).join("");
</script>
