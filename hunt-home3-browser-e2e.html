<!doctype html><meta charset="utf-8"><title>HUNT Home 3 QA</title>
<style>body{font:13px system-ui;background:#111;color:#eee;margin:14px}.case{border:1px solid #444;padding:8px;margin:10px 0}.pass{color:#76e8a2}.fail{color:#ff7e92}.viewport{overflow:hidden;max-height:360px}iframe{display:block;border:0;background:#fff}pre{white-space:pre-wrap}</style>
<h1>HUNT HOME 3.0 QA</h1><div id="host"></div><pre id="result">RUNNING</pre>
<script>
const specs=[390,768,1280,1440],host=document.querySelector('#host'),wait=ms=>new Promise(r=>setTimeout(r,ms));
async function one(w){
 const box=document.createElement('section');box.className='case';const status=document.createElement('div');status.textContent='RUNNING '+w;
 const wrap=document.createElement('div');wrap.className='viewport';wrap.style.width=w+'px';const f=document.createElement('iframe');f.width=w;f.height=1000;f.src='./index.html';wrap.appendChild(f);box.append(status,wrap);host.appendChild(box);
 await new Promise(r=>f.addEventListener('load',r,{once:true}));await wait(6500);
 const d=f.contentDocument,root=d.documentElement;
 const overflow=Math.max(0,root.scrollWidth-root.clientWidth);
 const hero=d.querySelectorAll('#hd-home3-hero-mosaic .hd-home3-card').length;
 const heroImages=d.querySelectorAll('#hd-home3-hero-mosaic img[src^="https://"]').length;
 const women=d.querySelectorAll('#hd-home3-women .hd-home3-card').length;
 const acc=d.querySelectorAll('#hd-home3-accessories .hd-home3-card').length;
 const beauty=d.querySelectorAll('#hd-home3-beauty .hd-home3-card').length;
 const forYou=d.querySelectorAll('#hd-home3-for-you .hd-home3-card').length;
 const look=d.querySelectorAll('#hd-home3-look-products .hd-home3-card').length;
 const fresh=d.querySelectorAll('#hd-home3-fresh .hd-home3-card').length;
 const endless=d.querySelectorAll('#hd-home-random-grid .hd-shelf-card').length;
 const advisor=!!d.querySelector('.hd-advisor');
 const home3=!!d.querySelector('script[src*="hunt-home-3.js"]')&&d.body.classList.contains('hd-home3');
 const columns=d.querySelector('#hd-home3-for-you')?getComputedStyle(d.querySelector('#hd-home3-for-you')).gridTemplateColumns.split(' ').filter(Boolean).length:0;
 const pass=home3&&!advisor&&overflow<=4&&hero>=3&&heroImages>=3&&women>=4&&acc>=3&&beauty>=3&&forYou>=6&&look>=3&&fresh>=6&&endless>=20&&((w<=760&&columns===2)||(w>760&&columns>=4));
 const out={width:w,pass,overflow,home3,advisor,hero,heroImages,women,acc,beauty,forYou,look,fresh,endless,columns};
 status.className=pass?'pass':'fail';status.textContent=(pass?'PASS ':'FAIL ')+JSON.stringify(out);return out;
}
(async()=>{const results=[];for(const w of specs)results.push(await one(w));const pass=results.every(x=>x.pass);document.body.dataset.qa=pass?'pass':'fail';document.querySelector('#result').textContent=(pass?'PASS':'FAIL')+'\n'+JSON.stringify({pass,results},null,2)})();
</script>
