<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUNT Motion Lab v1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05060a;color:#eef4ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;overflow:hidden}
.lab{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;position:relative;background:radial-gradient(circle at 50% 34%,rgba(82,104,255,.18),transparent 34%),radial-gradient(circle at 78% 22%,rgba(0,208,255,.09),transparent 28%),linear-gradient(180deg,#080b12 0%,#05060a 58%,#030407 100%);isolation:isolate}
.lab:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 76%)}
.top,.bottom{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.top span{opacity:.55}.top strong{color:#d9ebff}.bottom{letter-spacing:.04em;text-transform:none;color:#93a5bd}.bottom button{border:1px solid rgba(202,230,255,.22);background:rgba(255,255,255,.05);color:#f8fcff;border-radius:999px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(14px)}
.stage{position:relative;display:grid;place-items:center;perspective:1300px}.aura{position:absolute;width:430px;height:170px;border-radius:50%;background:rgba(79,111,255,.2);filter:blur(70px);opacity:.36}
.logo{position:relative;width:min(72vw,720px);aspect-ratio:3.2/1;display:grid;place-items:center;transform-style:preserve-3d;will-change:transform,opacity}
.word{position:relative;z-index:5;display:flex;justify-content:center;align-items:center;gap:.012em;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-size:clamp(82px,14vw,194px);font-weight:950;line-height:.8;letter-spacing:-.075em;transform-style:preserve-3d}
.letter{position:relative;display:inline-grid;place-items:center;min-width:.65em;transform-style:preserve-3d;will-change:transform,opacity,filter}
.face{display:block;position:relative;transform:translateZ(22px);color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(118deg,#4d63ff 0%,#78d7ff 15%,#fbffff 34%,#c8cfff 49%,#755dff 68%,#bdf1ff 86%,#fff 100%);background-size:230% 100%;background-position:12% 0;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 14px 23px rgba(53,74,255,.2)) drop-shadow(0 2px 0 rgba(255,255,255,.35))}
.letter:before{content:attr(data-letter);position:absolute;inset:0;z-index:-1;color:#2b3262;transform:translate3d(8px,11px,-18px);opacity:.78;text-shadow:0 3px 0 #171d41,0 7px 10px rgba(0,0,0,.72)}
.shine{position:absolute;z-index:9;top:17%;left:11%;width:18%;height:61%;opacity:0;transform:translateX(-250%) skewX(-18deg);pointer-events:none;mix-blend-mode:screen;background:linear-gradient(90deg,transparent 0%,rgba(192,232,255,.1) 20%,rgba(255,255,255,.98) 50%,rgba(182,221,255,.18) 80%,transparent 100%);filter:blur(6px) drop-shadow(0 0 18px rgba(205,238,255,.72));border-radius:50%}
.star{position:absolute;z-index:13;top:1%;right:13%;width:1px;height:1px;opacity:0;transform-style:preserve-3d}.star-core{position:absolute;left:50%;top:50%;font-size:clamp(60px,8vw,110px);line-height:1;transform:translate(-50%,-50%);color:#fff;text-shadow:0 0 5px #fff,0 0 15px rgba(151,226,255,.98),0 0 36px rgba(101,105,255,.82),0 0 68px rgba(88,65,255,.46)}
.spark{position:absolute;color:#e9fbff;text-shadow:0 0 10px #fff;font-size:23px;opacity:0}.spark.a{left:-72px;top:7px}.spark.b{left:49px;top:42px;font-size:16px}
.smile{position:absolute;z-index:11;width:44%;height:auto;right:4%;bottom:1%;overflow:visible;opacity:0;filter:drop-shadow(0 0 6px rgba(178,231,255,.9)) drop-shadow(0 0 18px rgba(92,119,255,.46))}.smile path{fill:none;stroke:#effcff;stroke-width:8;stroke-linecap:round;stroke-dasharray:360;stroke-dashoffset:360}
.caption{position:absolute;bottom:13%;margin:0;color:#91a5c0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.62}
@media(max-width:720px){.top,.bottom{padding:18px 16px}.top{gap:10px;align-items:flex-start}.top strong{text-align:right}.logo{width:94vw}.word{font-size:clamp(72px,22vw,122px)}.star{right:9%;top:4%}.smile{width:49%;right:1%;bottom:5%}.caption{bottom:18%;font-size:9px;letter-spacing:.15em}}
@media(prefers-reduced-motion:reduce){.letter,.face,.shine,.star,.smile,.smile path,.spark{animation:none!important}.letter{opacity:1!important;transform:none!important}.star{opacity:.9!important;transform:scale(.72)!important}.smile{opacity:.8!important}.smile path{stroke-dashoffset:0!important}}
</style>
</head>
<body>
<main class="lab">
<header class="top"><span>HUNT MOTION LAB</span><strong>V1 · 5.0 SEC · 3D SIGNATURE</strong></header>
<section class="stage">
<div class="aura"></div>
<div class="logo" id="logo" aria-label="HUNT">
<div class="word" aria-hidden="true">
<span class="letter" data-letter="H"><span class="face">H</span></span>
<span class="letter" data-letter="U"><span class="face">U</span></span>
<span class="letter" data-letter="N"><span class="face">N</span></span>
<span class="letter t" data-letter="T"><span class="face">T</span></span>
</div>
<div class="shine" aria-hidden="true"></div>
<div class="star" aria-hidden="true"><span class="star-core">✦</span><span class="spark a">✦</span><span class="spark b">✦</span></div>
<svg class="smile" viewBox="0 0 300 110" aria-hidden="true"><path d="M28 28 C92 100 208 100 272 28"/></svg>
</div>
<p class="caption">slow descent · glass sweep · T spin · star · smile</p>
</section>
<footer class="bottom"><button id="replay" type="button">Replay now</button><span id="state">5-second loop · isolated from production</span></footer>
</main>
<script>
(() => {
  const reduce=matchMedia("(prefers-reduced-motion: reduce)");
  const logo=document.querySelector("#logo");
  const letters=[...document.querySelectorAll(".letter")];
  const faces=[...document.querySelectorAll(".face")];
  const t=document.querySelector(".t");
  const shine=document.querySelector(".shine");
  const star=document.querySelector(".star");
  const smile=document.querySelector(".smile");
  const path=document.querySelector(".smile path");
  const sparks=[...document.querySelectorAll(".spark")];
  let timer=0, running=[];

  function anim(el,keyframes,options){
    const a=el.animate(keyframes,{fill:"forwards",...options});
    running.push(a); return a;
  }
  function stop(){clearTimeout(timer);running.forEach(a=>a.cancel());running=[];}
  function still(){
    stop();logo.style.opacity="1";letters.forEach(x=>{x.style.opacity="1";x.style.transform="none";});
    star.style.opacity=".9";star.style.transform="scale(.72)";smile.style.opacity=".8";path.style.strokeDashoffset="0";
  }
  function cycle(){
    if(reduce.matches){still();return;}
    stop();
    logo.style.opacity="1";logo.style.transform="translate3d(0,0,0) scale(1)";
    letters.forEach((el,i)=>{
      el.style.opacity="0";
      anim(el,[
        {opacity:0,transform:"translate3d(0,-118px,-28px) rotateX(-64deg) rotateZ(-2deg) scale(.9)",filter:"blur(8px) brightness(1.3)"},
        {opacity:1,offset:.62,transform:"translate3d(0,8px,12px) rotateX(7deg) rotateZ(.4deg) scale(1.035)",filter:"blur(0) brightness(1.16)"},
        {opacity:1,offset:.82,transform:"translate3d(0,-2px,5px) rotateX(-2deg) scale(.995)",filter:"blur(0) brightness(1.04)"},
        {opacity:1,transform:"translate3d(0,0,0) rotateX(0) scale(1)",filter:"blur(0) brightness(1)"}
      ],{duration:1020,delay:i*95,easing:"cubic-bezier(.14,.74,.18,1.08)"});
    });
    faces.forEach((f,i)=>anim(f,[{backgroundPosition:"10% 0"},{backgroundPosition:"108% 0"}],{duration:1200,delay:180+i*70,easing:"ease-out"}));
    anim(shine,[
      {opacity:0,transform:"translateX(-250%) skewX(-18deg)"},
      {opacity:.98,offset:.16},
      {opacity:1,offset:.54,filter:"blur(5px) brightness(1.4) drop-shadow(0 0 24px rgba(205,238,255,.95))"},
      {opacity:0,transform:"translateX(430%) skewX(-18deg)"}
    ],{duration:1100,delay:1260,easing:"cubic-bezier(.2,.7,.2,1)"});
    anim(t.querySelector(".face"),[
      {transform:"translateZ(22px) rotateY(0deg) scale(1)",filter:"brightness(1)"},
      {offset:.38,transform:"translate3d(0,-6px,40px) rotateY(145deg) scale(1.08)",filter:"brightness(1.42)"},
      {offset:.72,transform:"translate3d(0,-2px,30px) rotateY(310deg) scale(.98)",filter:"brightness(1.18)"},
      {transform:"translateZ(22px) rotateY(360deg) scale(1)",filter:"brightness(1)"}
    ],{duration:980,delay:2200,easing:"cubic-bezier(.16,.72,.18,1.04)"});
    anim(star,[
      {opacity:0,transform:"translate3d(34px,-26px,24px) scale(.06) rotate(-120deg)"},
      {opacity:1,offset:.3,transform:"translate3d(9px,-7px,28px) scale(1.28) rotate(155deg)"},
      {opacity:1,offset:.67,transform:"translate3d(0,1px,16px) scale(.82) rotate(390deg)"},
      {opacity:.98,transform:"translate3d(0,0,14px) scale(.76) rotate(540deg)"}
    ],{duration:980,delay:2780,easing:"cubic-bezier(.12,.78,.2,1.08)"});
    sparks.forEach((s,i)=>anim(s,[
      {opacity:0,transform:"scale(.1) rotate(0deg)"},
      {opacity:1,offset:.42,transform:"scale(1.2) rotate(78deg)"},
      {opacity:0,transform:"scale(.25) rotate(150deg)"}
    ],{duration:600,delay:3140+i*150,easing:"ease-out"}));
    smile.style.opacity="0";path.style.strokeDashoffset="360";
    anim(smile,[{opacity:0},{opacity:1}],{duration:380,delay:3300,easing:"ease-out"});
    anim(path,[{strokeDashoffset:360,strokeWidth:6},{offset:.72,strokeDashoffset:0,strokeWidth:9},{strokeDashoffset:0,strokeWidth:8}],{duration:800,delay:3300,easing:"cubic-bezier(.2,.74,.16,1)"});
    anim(logo,[{opacity:1,transform:"translate3d(0,0,0) scale(1)"},{opacity:1,offset:.38},{opacity:0,transform:"translate3d(0,-14px,0) scale(.988)"}],{duration:440,delay:4520,easing:"ease-in"});
    timer=setTimeout(cycle,5000);
  }
  document.querySelector("#replay").addEventListener("click",cycle);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)cycle();});
  reduce.addEventListener?.("change",cycle);
  cycle();
})();
</script>
</body>
</html>
