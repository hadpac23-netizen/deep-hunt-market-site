<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUNT Shopper Browser E2E</title></head><body>
<main id="qa-root">
  <article class="hd-market-product-card" data-category="phoneaccessories">
    <a class="hd-market-card-media" href="product.html?provider=CJdropshipping&id=E2E-ITEM-001"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="E2E"></a>
    <a class="hd-market-card-title" href="product.html?provider=CJdropshipping&id=E2E-ITEM-001">Browser E2E Product</a>
  </article>
  <pre id="qa-result">RUNNING</pre>
</main>
<script src="market-core.js"></script>
<script src="hunt-experience-memory.js"></script>
<script>
window.supabase={createClient(){return {auth:{getSession:async()=>({data:{session:null}})}}}};
</script>
<script src="shopping-actions.js"></script>
<script>
(async()=>{
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  localStorage.removeItem("hunt_local_product_actions_v1");
  localStorage.removeItem("hunt_experience_memory_v1");
  window.HuntExperienceMemory?.clear?.();
  window.HuntShoppingActions?.rescan?.();
  await wait(120);
  const like=document.querySelector('[data-shop-action="like"]');
  const save=document.querySelector('[data-shop-action="save"]');
  like?.click(); save?.click();
  window.dispatchEvent(new CustomEvent("hunt:share",{detail:{provider:"CJdropshipping",item_id:"E2E-ITEM-001",category:"phoneaccessories",source:"browser-e2e"}}));
  await wait(120);
  const rows=window.HuntShoppingActions?.snapshot?.()||[];
  const memory=window.HuntExperienceMemory?.events?.()||[];
  const groups=window.HuntExperienceMemory?.historyGroups?.()||{};
  const item=rows.find(x=>x.item_id==="E2E-ITEM-001")||null;
  const types=memory.map(x=>x.type);
  const pass=Boolean(item?.liked&&item?.saved&&types.includes("like")&&types.includes("save")&&types.includes("share")&&(groups.today||[]).length>=3);
  const result={pass,item,types,today:(groups.today||[]).length,local:JSON.parse(localStorage.getItem("hunt_local_product_actions_v1")||"{}")};
  document.body.dataset.qa=pass?"pass":"fail";
  document.querySelector("#qa-result").textContent=(pass?"PASS":"FAIL")+"\n"+JSON.stringify(result,null,2);
})();
</script></body></html>
